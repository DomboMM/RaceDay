name: RaceDay CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # PART 1 VALIDATION
      # ==========================================
      - name: Check required Part 1 files
        run: |
          test -f README.md
          test -f docs/RaceDay_ERD.pdf
          test -f docs/RaceDay_API_Endpoint_Plan.pdf
          test -f docs/RaceDay_Database.sql
          echo "All required RaceDay Part 1 files are present."

      - name: Validate SQL script
        run: |
          grep -q "CREATE TABLE Users" docs/RaceDay_Database.sql
          grep -q "CREATE TABLE EventTypes" docs/RaceDay_Database.sql
          grep -q "CREATE TABLE Events" docs/RaceDay_Database.sql
          grep -q "CREATE TABLE Categories" docs/RaceDay_Database.sql
          grep -q "CREATE TABLE Enrolments" docs/RaceDay_Database.sql
          grep -q "CREATE TABLE Results" docs/RaceDay_Database.sql
          echo "SQL table definitions found."

      # ==========================================
      # PART 2 - .NET SETUP
      # ==========================================
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ==========================================
      # RESTORE
      # ==========================================
      - name: Restore dependencies
        run: dotnet restore RaceDayAPI/RaceDayAPI.slnx

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build solution
        run: dotnet build RaceDayAPI/RaceDayAPI.slnx --configuration Release --no-restore

      # ==========================================
      # UNIT TESTS
      # ==========================================
      - name: Run unit tests
        run: dotnet test RaceDayAPI/RaceDayAPI.slnx --configuration Release --no-build --verbosity normal